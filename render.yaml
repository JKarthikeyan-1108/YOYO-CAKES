# Render Deployment Blueprint for YOYO CAKES
# For zero-cost, high-speed CDN hosting with automatic Let's Encrypt SSL.
services:
  - type: web
    name: yoyo-cakes
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      # Single Page App rewrite rule for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
